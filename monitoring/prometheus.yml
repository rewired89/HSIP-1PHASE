# Prometheus configuration for HSIP Phase 2

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'hsip-production'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Scrape configurations
scrape_configs:
  # HSIP Daemon metrics
  - job_name: 'hsip-daemon'
    static_configs:
      - targets: ['hsip-daemon:8787']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL exporter (requires postgres_exporter container)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis exporter (requires redis_exporter container)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
