[workspace]
members = [
    "crates/hsip-core",
    "crates/hsip-session",
    "crates/hsip-net",
    "crates/hsip-reputation",
    "crates/hsip-cli",
    "crates/hsip-auth",
    "crates/hsip-gateway",
    # hsip-intercept: now cross-platform (Windows/Android/Linux/macOS)
    # Build with: cargo build -p hsip-intercept
    "crates/hsip-intercept",
    # hsip-verify: pulls in z3-sys, which builds the Z3 SMT solver from
    # source on first compile (~8 minutes, one-time — cached by Cargo like
    # any other dependency afterward). Requires cmake + a C++ toolchain,
    # both already required to build this workspace's other native deps.
    "crates/hsip-verify",
    "crates/hsip-common",
    "crates/hsip-regenerative",
    "crates/hsip-telemetry-guard",
    "crates/hsip-integration-sdk",
    "crates/hsip-api",
    "crates/hsip-dns",
    "crates/hsip-mcp",
]


exclude = ["crates/hsip-session/fuzz"]
resolver = "2"

[workspace.dependencies]
tokio   = "1.39"
mio     = "0.8.11"
socket2 = "0.5.7"
windows = "0.58.0"
windows-sys = "0.60.2"
windows-targets = "0.53.5"
toolchain = "1.87.0"
