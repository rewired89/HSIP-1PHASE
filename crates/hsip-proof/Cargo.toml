[package]
name = "hsip-proof"
version = "0.1.0"
edition = "2021"
description = "HSIP: open proof format and pure, DB-free verifier (RFC 6962 Merkle, RFC 8785 JCS, Ed25519)"
license = "SEE LICENSE IN LICENSE-ENTERPRISE"
authors = ["Nyx Systems LLC"]

[[bin]]
name = "hsip-proof"
path = "src/bin/hsip_proof.rs"
required-features = ["keygen"]

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs  = "0.2"
sha2       = "0.10"
hex        = "0.4"
base64     = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand       = { version = "0.8", optional = true }

[features]
default = ["keygen"]
# Key generation needs OS randomness; the in-browser verifier builds without it.
keygen = ["dep:rand"]
