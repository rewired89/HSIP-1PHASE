[package]
name = "hsip-api"
version = "2.0.0"
edition = "2021"
license = "SEE LICENSE IN LICENSE-ENTERPRISE"
description = "HSIP Phase 2: Enterprise REST API and SDK layer"
authors = ["Nyx Systems LLC"]

[dependencies]
tokio = { version = "1.39", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Internal dependencies
hsip-core = { path = "../hsip-core" }
hsip-enterprise = { path = "../hsip-enterprise" }
hsip-verify = { path = "../hsip-verify" }
hsip-policy = { path = "../hsip-policy" }
hsip-audit = { path = "../hsip-audit" }

[dev-dependencies]
hyper = "1.1"
