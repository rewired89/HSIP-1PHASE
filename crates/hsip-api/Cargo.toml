[package]
name = "hsip-api"
version = "0.2.0"
edition = "2021"
description = "HSIP REST API - Multi-tenant identity, consent, and message verification service"
license = "LicenseRef-Proprietary"

[[bin]]
name = "hsip-api"
path = "src/main.rs"

[features]
# Build with --features embed-dashboard to bundle the React UI into the binary.
# Requires `dashboard/dist/` to exist (run `npm run build` in dashboard/ first).
# Release builds always use this; local dev uses `npm run dev` on port 5173.
embed-dashboard = ["rust-embed", "mime_guess"]

[dependencies]
axum             = { version = "0.7", features = ["multipart"] }
axum-server      = { version = "0.8", features = ["tls-rustls"] }
tokio            = { version = "1", features = ["full"] }
tower-http       = { version = "0.5", features = ["cors", "limit", "request-id"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
toml             = "0.8"
sqlx             = { version = ">=0.8.1, <0.9", features = ["runtime-tokio", "any", "sqlite", "postgres", "macros"] }
uuid             = { version = "1", features = ["v4"] }
sha2             = "0.10"
hex              = "0.4"
rand             = "0.8"
anyhow           = "1"
thiserror        = "1"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
base64           = "0.22"
ed25519-dalek    = { version = "2", features = ["rand_core"] }
dashmap          = "5"
prometheus       = { version = "0.13", features = ["process"] }
once_cell        = "1"
chacha20poly1305 = "0.10"
hkdf             = "0.12"
webbrowser       = "1"
reqwest          = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rust-embed       = { version = "8", optional = true }
mime_guess       = { version = "2", optional = true }
hsip-core        = { path = "../hsip-core" }
hsip-dns         = { path = "../hsip-dns" }

# Windows-only: shortcut creation during self-install (pure Rust, no subprocess)
[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
dirs  = "5"

[dev-dependencies]
tower            = { version = "0.4", features = ["util"] }
http-body-util   = "0.1"
wiremock         = "0.6"

[lib]
name = "hsip_api"
path = "src/lib.rs"
