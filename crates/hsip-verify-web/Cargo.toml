[package]
name = "hsip-verify-web"
version = "0.1.0"
edition = "2021"
description = "HSIP: the open proof verifier compiled to WebAssembly for the in-browser verifier page"
license = "Apache-2.0"
authors = ["Nyx Systems LLC"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hsip-proof = { path = "../hsip-proof", default-features = false }
serde_json = "1"
wasm-bindgen = "0.2"
