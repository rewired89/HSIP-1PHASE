[package]
name = "hsip-audit"
version = "2.0.0"
edition = "2021"
license = "SEE LICENSE IN LICENSE-ENTERPRISE"
description = "HSIP Phase 2: Tamper-evident audit logging (IVAT-style)"
authors = ["Nyx Systems LLC"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5"
blake3 = "1.5"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
ed25519-dalek = "2.1"
csv = "1.3"

# Internal dependencies
hsip-core = { path = "../hsip-core" }
hsip-verify = { path = "../hsip-verify" }
hsip-policy = { path = "../hsip-policy" }

[dev-dependencies]
tokio = { version = "1.39", features = ["full"] }
tempfile = "3.10"
