[package]
name = "hsip-mcp"
version = "0.1.0"
edition = "2021"
description = "HSIP MCP server — gives AI agents cryptographic identity, consent checks, and a tamper-proof audit trail"
license = "MIT"

[[bin]]
name = "hsip-mcp"
path = "src/main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest    = { version = "0.12", features = ["json", "blocking"] }
anyhow     = "1"
dirs       = "5"
