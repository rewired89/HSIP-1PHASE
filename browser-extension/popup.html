<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSIP Privacy Shield</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      width: 320px;
      min-height: 200px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1f2e 0%, #0f1117 100%);
      border-bottom: 1px solid #2d3748;
      padding: 16px 18px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .shield-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .header-text { flex: 1; }
    .header-title { font-size: 15px; font-weight: 700; color: #f7fafc; }
    .header-sub   { font-size: 11px; color: #718096; margin-top: 1px; }

    /* Status dot */
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .status-dot.connected    { background: #48bb78; box-shadow: 0 0 6px #48bb78; }
    .status-dot.disconnected { background: #4a5568; }

    /* Main counter */
    .counter-section {
      padding: 20px 18px 16px;
      text-align: center;
      border-bottom: 1px solid #2d3748;
    }

    .counter-number {
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
      color: #fc8181;
    }
    .counter-number.zero { color: #48bb78; }

    .counter-label {
      font-size: 12px;
      color: #718096;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Domain list */
    .domain-section {
      padding: 12px 18px;
      border-bottom: 1px solid #2d3748;
      max-height: 160px;
      overflow-y: auto;
    }

    .domain-section-title {
      font-size: 10px;
      font-weight: 600;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .domain-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      font-size: 12px;
      color: #a0aec0;
      border-bottom: 1px solid #1a202c;
    }
    .domain-item:last-child { border-bottom: none; }

    .domain-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #e53e3e; flex-shrink: 0;
    }

    .domain-name { flex: 1; font-family: monospace; }

    .no-trackers {
      font-size: 12px;
      color: #4a5568;
      text-align: center;
      padding: 8px 0;
    }

    /* HSIP connection status */
    .hsip-section {
      padding: 12px 18px;
      border-bottom: 1px solid #2d3748;
    }

    .hsip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hsip-label {
      font-size: 12px;
      color: #718096;
    }

    .hsip-status-text {
      font-size: 12px;
      font-weight: 600;
    }
    .hsip-status-text.connected    { color: #48bb78; }
    .hsip-status-text.disconnected { color: #718096; }

    .btn-connect {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #4a5568;
      background: #2d3748;
      color: #a0aec0;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-connect:hover { border-color: #68d391; color: #68d391; }

    /* API key input */
    .key-section {
      padding: 12px 18px;
      border-bottom: 1px solid #2d3748;
    }
    .key-label {
      font-size: 11px;
      color: #718096;
      margin-bottom: 6px;
    }
    .key-row { display: flex; gap: 6px; }
    .key-input {
      flex: 1;
      background: #1a202c;
      border: 1px solid #2d3748;
      border-radius: 4px;
      color: #e2e8f0;
      font-size: 11px;
      font-family: monospace;
      padding: 5px 8px;
      outline: none;
    }
    .key-input:focus { border-color: #4299e1; }
    .btn-save {
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 4px;
      border: none;
      background: #4299e1;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn-save:hover { background: #3182ce; }

    /* Footer */
    .footer {
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-link {
      font-size: 11px;
      color: #4a5568;
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-link:hover { color: #a0aec0; }

    .btn-open-hsip {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #2b6cb0;
      background: transparent;
      color: #4299e1;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-open-hsip:hover { background: #2b6cb0; color: #fff; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <svg class="shield-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18 3L6 8v9c0 8.3 5.1 16 12 18 6.9-2 12-9.7 12-18V8L18 3z"
            fill="#2b6cb0" stroke="#4299e1" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M13 18l3.5 3.5L23 14" stroke="#68d391" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="header-text">
      <div class="header-title">HSIP Privacy Shield</div>
      <div class="header-sub">Local identity server — no cloud</div>
    </div>
    <div class="status-dot disconnected" id="statusDot"></div>
  </div>

  <!-- Counter -->
  <div class="counter-section">
    <div class="counter-number zero" id="blockedCount">0</div>
    <div class="counter-label">trackers blocked on this page</div>
  </div>

  <!-- Blocked domains list -->
  <div class="domain-section" id="domainSection" style="display:none">
    <div class="domain-section-title">Blocked on this page</div>
    <div id="domainList"></div>
  </div>

  <!-- HSIP connection -->
  <div class="hsip-section">
    <div class="hsip-row">
      <span class="hsip-label">HSIP server</span>
      <span class="hsip-status-text disconnected" id="hsipStatusText">Not connected</span>
    </div>
  </div>

  <!-- API key input (shown when not connected) -->
  <div class="key-section" id="keySection">
    <div class="key-label">Enter your HSIP API key to connect (found in ~/.hsip/admin.key)</div>
    <div class="key-row">
      <input type="password" class="key-input" id="keyInput" placeholder="hsip_...">
      <button class="btn-save" id="saveKeyBtn">Save</button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="https://github.com/rewired89/HSIP-1PHASE" target="_blank" class="footer-link">
      HSIP on GitHub
    </a>
    <button class="btn-open-hsip" id="openDashboardBtn">Open Dashboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
