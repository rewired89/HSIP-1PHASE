name: Bug Report
description: Something is broken or not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you provide, the faster we can fix it.

  - type: dropdown
    id: component
    attributes:
      label: Which part of HSIP is affected?
      options:
        - API server (hsip-api)
        - DNS tracker blocker
        - Signed messages
        - Consent wallet
        - AI Watch / AI agent integration
        - Audit trail
        - Dashboard (UI)
        - Browser extension
        - CLI
        - Installation (install.sh / install.ps1 / Homebrew)
        - SDK (Python / Node.js / Go)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: HSIP version
      description: Run `hsip --version` or check the dashboard footer
      placeholder: "e.g. 0.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start HSIP with `hsip`
        2. Navigate to the Consent Wallet
        3. Click "Grant consent"
        4. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Paste any error output from the terminal or browser console.
      render: shell
