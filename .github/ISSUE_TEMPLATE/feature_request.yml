name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make HSIP better? Describe what you want and why it matters.

  - type: dropdown
    id: audience
    attributes:
      label: Who benefits from this?
      multiple: true
      options:
        - Regular users (tracker blocking, privacy)
        - Developers building AI agents
        - Enterprise / compliance teams
        - Security researchers
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation or gap this addresses.
      placeholder: "e.g. I can't easily verify a message signed by someone else without running HSIP..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the feature or behaviour you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What alternatives have you considered?
      description: Other tools, workarounds, or approaches you've tried.

  - type: dropdown
    id: contribution
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes — I'd like to implement this"
        - "Maybe — I could help with parts of it"
        - "No — just suggesting it"
