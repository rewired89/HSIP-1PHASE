# HSIP Build & Release Workflow
#
# Triggers on every push to main → updates the rolling "latest" pre-release.
# Users download from: https://github.com/rewired89/HSIP-1PHASE/releases/tag/latest
#
# Trigger manually any time from: Actions → Build & release → Run workflow

name: Build & release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name:   Windows x64
            os:     windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/hsip-api.exe
            asset:  hsip-windows-x64.exe

          - name:   macOS Apple Silicon
            os:     macos-latest
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/hsip-api
            asset:  hsip-macos-arm64

          - name:   macOS Intel
            os:     macos-latest
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/hsip-api
            asset:  hsip-macos-x64

          - name:   Linux x64
            os:     ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/hsip-api
            asset:  hsip-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Dashboard ──────────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Verify dashboard dist exists
        shell: bash
        run: |
          echo "Dashboard dist contents:"
          ls -lh dashboard/dist/

      # ── Rust ───────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Print Rust version
        run: rustc --version && cargo --version

      - name: Build binary
        run: cargo build --release --package hsip-api --target ${{ matrix.target }} --features hsip-api/embed-dashboard

      # ── Package ────────────────────────────────────────────────────────────
      - name: Package asset (Unix)
        if: runner.os != 'Windows'
        run: |
          strip ${{ matrix.binary }} || true
          cp ${{ matrix.binary }} ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}
          ls -lh ${{ matrix.asset }}

      - name: Package asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.binary }}" "${{ matrix.asset }}"
          Get-Item "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 3

  # ── Release ─────────────────────────────────────────────────────────────────
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List downloaded files
        run: ls -lh

      - name: Create or update "latest" pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release if it doesn't exist yet
          gh release view latest --repo rewired89/HSIP-1PHASE > /dev/null 2>&1 \
            || gh release create latest \
                 --repo rewired89/HSIP-1PHASE \
                 --prerelease \
                 --title "Latest build (auto-updated)" \
                 --notes "Initializing..."

          # Write release notes
          cat > notes.md << 'EOF'
Rebuilds automatically on every push to main. Always download from here for the latest version.

| Platform | File |
|----------|------|
| **Windows 10 / 11** | `hsip-windows-x64.exe` |
| macOS Apple Silicon (M1/M2/M3/M4) | `hsip-macos-arm64` |
| macOS Intel | `hsip-macos-x64` |
| Linux x64 | `hsip-linux-x64` |

**Windows:** Download `hsip-windows-x64.exe`, double-click it. If Windows shows a blue warning screen click **More info → Run anyway**. Then open your browser and go to `localhost:7474`.
EOF
          echo "" >> notes.md
          echo "Built from commit: ${{ github.sha }}" >> notes.md

          gh release edit latest \
            --repo rewired89/HSIP-1PHASE \
            --title "Latest build (auto-updated)" \
            --notes-file notes.md

          # Upload binaries (--clobber replaces any existing files)
          gh release upload latest \
            hsip-windows-x64.exe \
            hsip-macos-arm64 \
            hsip-macos-x64 \
            hsip-linux-x64 \
            --repo rewired89/HSIP-1PHASE \
            --clobber

          echo "✅ Release updated successfully"
          gh release view latest --repo rewired89/HSIP-1PHASE
