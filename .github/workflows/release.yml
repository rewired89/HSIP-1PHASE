# HSIP Build Workflow
#
# Builds a self-contained binary for Windows, macOS, and Linux.
# Each binary embeds the React dashboard — users just download and run.
#
# TWO triggers:
#   1. Push to main → rebuilds the "latest" pre-release automatically.
#      Download from: https://github.com/rewired89/HSIP-1PHASE/releases/tag/latest
#
#   2. A versioned release is published (e.g. v1.0.2) → attaches binaries
#      to that release as the official stable download.

name: Build & release

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────────────────────────
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/hsip-api.exe
            asset: hsip-windows-x64.exe

          # ── macOS ─────────────────────────────────────────────────────────────
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/hsip-api
            asset: hsip-macos-arm64

          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/hsip-api
            asset: hsip-macos-x64

          # ── Linux ─────────────────────────────────────────────────────────────
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/hsip-api
            asset: hsip-linux-x64

    steps:
      # ── Source ───────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Build the React dashboard (must happen before cargo build) ────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      # ── Rust toolchain ────────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── Compile ───────────────────────────────────────────────────────────────
      - name: Build (with embedded dashboard)
        run: cargo build --release --package hsip-api --target ${{ matrix.target }} --features hsip-api/embed-dashboard

      # ── Strip + rename ────────────────────────────────────────────────────────
      - name: Prepare asset (Unix)
        if: runner.os != 'Windows'
        run: |
          strip ${{ matrix.binary }} || true
          cp ${{ matrix.binary }} ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}

      - name: Prepare asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "${{ matrix.binary }}" "${{ matrix.asset }}"

      # ── On push to main: update the rolling "latest" pre-release ─────────────
      - name: Upload to rolling "latest" release (push to main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (auto-updated)"
          prerelease: true
          body: |
            This release is **automatically rebuilt every time a fix is pushed to main**.
            Always download from here to get the most recent version.

            | Platform | Download |
            |----------|----------|
            | **Windows** | `hsip-windows-x64.exe` — double-click, done |
            | macOS Apple Silicon | `hsip-macos-arm64` |
            | macOS Intel | `hsip-macos-x64` |
            | Linux | `hsip-linux-x64` |

            **Windows:** Download `hsip-windows-x64.exe` and double-click it.
            On first run it installs itself, creates a Desktop shortcut and Start Menu entry, then opens in your browser.
            Use the shortcut from then on.

            Last updated: ${{ github.sha }}
          files: ${{ matrix.asset }}

      # ── On versioned release: attach to that release ──────────────────────────
      - name: Upload to versioned release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
