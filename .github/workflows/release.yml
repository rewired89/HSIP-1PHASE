# HSIP Build & Release Workflow
#
# Triggers on every push to main → updates the rolling "latest" pre-release.
# Users always download from: https://github.com/rewired89/HSIP-1PHASE/releases/tag/latest
#
# Trigger manually any time from: Actions → Build & release → Run workflow
#
# Architecture:
#   build  (matrix, 4 parallel jobs) → compiles each platform binary
#   release (single job, runs after all builds finish) → uploads everything at once

name: Build & release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Build ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name:   Windows x64
            os:     windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/hsip-api.exe
            asset:  hsip-windows-x64.exe

          - name:   macOS Apple Silicon
            os:     macos-latest
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/hsip-api
            asset:  hsip-macos-arm64

          - name:   macOS Intel
            os:     macos-latest
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/hsip-api
            asset:  hsip-macos-x64

          - name:   Linux x64
            os:     ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/hsip-api
            asset:  hsip-linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build dashboard
        working-directory: dashboard
        run: npm install && npm run build

      - name: Verify dashboard dist
        shell: bash
        run: ls -lh dashboard/dist/

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --package hsip-api --target ${{ matrix.target }} --features hsip-api/embed-dashboard

      - name: Prepare asset (Unix)
        if: runner.os != 'Windows'
        run: |
          strip ${{ matrix.binary }} || true
          cp ${{ matrix.binary }} ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}
          ls -lh ${{ matrix.asset }}

      - name: Prepare asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.binary }}" "${{ matrix.asset }}"
          Get-Item "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 3

  # ── Release ───────────────────────────────────────────────────────────────────────────
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List downloaded files
        run: ls -lh

      - name: Create or update "latest" pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release if it doesn't exist yet
          gh release view latest --repo rewired89/HSIP-1PHASE > /dev/null 2>&1 \
            || gh release create latest \
                 --repo rewired89/HSIP-1PHASE \
                 --prerelease \
                 --title "Latest build (auto-updated)" \
                 --notes "Initializing..."

          # Write release notes without heredoc to avoid YAML parse errors
          {
            echo "Rebuilds automatically on every push to main. Always download from here for the latest version."
            echo ""
            echo "DOWNLOADS"
            echo "---------"
            echo "Windows 10 / 11                    hsip-windows-x64.exe"
            echo "macOS Apple Silicon (M1/M2/M3/M4)  hsip-macos-arm64"
            echo "macOS Intel                         hsip-macos-x64"
            echo "Linux x64                           hsip-linux-x64"
            echo ""
            echo "Windows: Download hsip-windows-x64.exe and double-click it."
            echo "If Windows shows a blue warning screen, click More info then Run anyway."
            echo "Then open your browser and go to localhost:7474."
            echo ""
            echo "Built from commit: ${{ github.sha }}"
          } > notes.md

          gh release edit latest \
            --repo rewired89/HSIP-1PHASE \
            --title "Latest build (auto-updated)" \
            --notes-file notes.md

          # Upload binaries (--clobber replaces any existing files)
          gh release upload latest \
            hsip-windows-x64.exe \
            hsip-macos-arm64 \
            hsip-macos-x64 \
            hsip-linux-x64 \
            --repo rewired89/HSIP-1PHASE \
            --clobber

          echo "Release updated successfully"
          gh release view latest --repo rewired89/HSIP-1PHASE
