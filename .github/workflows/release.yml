# HSIP Release Workflow
#
# Builds a self-contained binary for Windows, macOS (Intel + Apple Silicon),
# and Linux. Each binary embeds the React dashboard — users just download
# and double-click (browser opens automatically at http://localhost:3000).
#
# Triggers automatically when a new GitHub Release is published.
# To create a release:  GitHub UI → Releases → Draft new release → Publish

name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────────────────────────
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/hsip-api.exe
            asset: hsip-windows-x64.exe

          # ── macOS ─────────────────────────────────────────────────────────────
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/hsip-api
            asset: hsip-macos-arm64

          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/hsip-api
            asset: hsip-macos-x64

          # ── Linux ─────────────────────────────────────────────────────────────
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/hsip-api
            asset: hsip-linux-x64

    steps:
      # ── Source ───────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Build the React dashboard (must happen before cargo build) ────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      # ── Rust toolchain ────────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── Compile ───────────────────────────────────────────────────────────────
      - name: Build (with embedded dashboard)
        run: cargo build --release --package hsip-api --target ${{ matrix.target }} --features hsip-api/embed-dashboard

      # ── Strip + rename ────────────────────────────────────────────────────────
      - name: Prepare asset (Unix)
        if: runner.os != 'Windows'
        run: |
          strip ${{ matrix.binary }} || true
          cp ${{ matrix.binary }} ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}

      - name: Prepare asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "${{ matrix.binary }}" "${{ matrix.asset }}"

      # ── Upload to the GitHub Release ──────────────────────────────────────────
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
