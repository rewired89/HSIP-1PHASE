name: HSIP platform

on:
  push:
    paths:
      - "crates/hsip-proof/**"
      - "crates/hsip-platform/**"
      - "crates/hsip-verify-web/**"
      - "verifier/**"
      - "sdk/**"
      - "docs/examples/prove/**"
      - "console/**"
      - ".github/workflows/prove.yml"
  pull_request:
    paths:
      - "crates/hsip-proof/**"
      - "crates/hsip-platform/**"
      - "crates/hsip-verify-web/**"
      - "verifier/**"
      - "sdk/**"
      - "docs/examples/prove/**"
      - "console/**"

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: cargo fmt -p hsip-proof -p hsip-platform -- --check
      - run: cargo clippy -p hsip-proof -p hsip-platform --all-targets -- -D warnings
      - run: cargo test -p hsip-proof -p hsip-platform
      - name: PostgreSQL compatibility
        run: cargo test -p hsip-platform --test postgres_compat -- --ignored
        env:
          HSP_TEST_POSTGRES_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
      - name: Console build
        run: npm ci && npm run build
        working-directory: console
      - name: Release build with embedded console
        run: cargo build --release -p hsip-platform --features embed-console

  sdks-and-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Node SDK integrations, and the compiled verifier the Proof Check page loads.
      - run: node --test sdk/prove-node/integrations.test.mjs crates/hsip-verify-web/smoke.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
        working-directory: sdk/prove-python

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      # rsa (RUSTSEC-2023-0071) is only in the lockfile via sqlx-mysql, which is not compiled here and has no patch.
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci && npm audit --omit=dev --audit-level=high
        working-directory: console
