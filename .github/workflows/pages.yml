name: Site (landing page and Proof Check)

on:
  push:
    branches: [main]
    paths:
      - "verifier/**"
      - "site/**"
      - "console/src/styles.css"
      - "docs/examples/prove/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Assemble site
        run: |
          mkdir -p _site/samples
          cp -r site/. _site/
          cp console/src/styles.css _site/console.css
          cp -r verifier _site/check
          cp docs/examples/prove/*.json _site/samples/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
