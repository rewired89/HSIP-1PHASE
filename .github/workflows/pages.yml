name: Site (landing page and Proof Check)

on:
  push:
    branches: [main]
    paths:
      - "verifier/**"
      - "site/**"
      - "docs/examples/prove/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site/samples
          cp -r site/. _site/
          cp -r verifier _site/check
          cp docs/examples/prove/*.json _site/samples/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
