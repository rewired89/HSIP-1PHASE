plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.hsip'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'

    // BouncyCastle for Ed25519 (crypto library)
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Maven publishing configuration
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.hsip'
                artifactId = 'hsip-android'
                version = '1.0.0'

                pom {
                    name = 'HSIP Android SDK'
                    description = 'Cryptographic message verification for Android banking apps'
                    url = 'https://github.com/nyxsystems/hsip-android'

                    licenses {
                        license {
                            name = 'HSIP Enterprise License'
                        }
                    }

                    developers {
                        developer {
                            name = 'Nyx Systems LLC'
                            email = 'support@nyxsystems.com'
                        }
                    }
                }
            }
        }
    }
}
